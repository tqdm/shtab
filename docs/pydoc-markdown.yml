loaders:
- type: python
  search_path: [..]
processors:
- type: filter
  documented_only: false
- type: pydoc_markdown_shtab.ShtabProcessor
- type: crossref
renderer:
  type: mkdocs
  markdown:
    source_linker:
      type: github
      repo: tqdm/shtab
      use_branch: true
    source_position: before signature
    source_format: |-
      <span style="float: right; font-size: 75%;">
      [[view source]]({url})
      </span>
  pages:
  - title: Home
    name: index
    source: index.md
  - title: Usage
    name: use
    source: use.md
  - title: 'Ref: shtab'
    name: ref
    contents:
    - shtab.FILE
    - shtab.DIRECTORY
    - shtab.glob
    - shtab.cmd
    - shtab.complete
    - shtab.add_argument_to
  - title: 'Ref: shtab.click'
    name: ref-click
    contents: [shtab.click.completion, shtab.click.complete]
  # external links
  - title: ↗ Source Code
    href: https://github.com/tqdm/shtab
  - title: ↗ Changelog
    href: https://github.com/tqdm/shtab/releases
  - title: ↗ Issues
    href: https://github.com/tqdm/shtab/issues
  - title: ↗ Contributing
    href: https://github.com/tqdm/shtab/blob/main/CONTRIBUTING.md
  - title: ↗ Licence
    href: https://github.com/tqdm/shtab/blob/main/LICENCE
  mkdocs_config:
    site_name: shtab documentation
    site_description: Automagic shell tab completion for Python CLI applications
    site_url: https://tqdm.github.io/shtab/
    site_author: Casper da Costa-Luis
    repo_name: tqdm/shtab
    repo_url: https://github.com/tqdm/shtab
    copyright: |
      &copy; Casper da Costa-Luis <a href="https://github.com/casperdcl">@casperdcl</a> 2021-2026
    extra:
      generator: false
    theme:
      name: material
      logo: https://github.com/tqdm/shtab/raw/main/meta/logo.png
      favicon: https://github.com/tqdm/shtab/raw/main/meta/logo.png
      custom_dir: ../../custom_theme/
      features: [content.tabs.link]
      palette:
      - scheme: default
        primary: white
        toggle:
          icon: material/toggle-switch-off-outline
          name: Switch to dark mode
      - scheme: slate
        primary: orange
        toggle:
          icon: material/toggle-switch
          name: Switch to light mode
    plugins:
    - search
    - minify:
        minify_js: true
        minify_html: true
    markdown_extensions:
    - admonition
    - toc:
        permalink: '#'
    - pymdownx.superfences
    - pymdownx.tabbed:
        alternate_style: true
